# Horizontal Pod Autoscaler (HPA)
# Escala automaticamente os pods baseado em uso de CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serverest-hpa
  namespace: serverest
  labels:
    app: serverest
spec:
  # Deployment alvo
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: serverest
  
  # Número mínimo e máximo de réplicas
  minReplicas: 2
  maxReplicas: 10
  
  # Métricas para autoscaling
  metrics:
  # Métrica de CPU
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Escala quando CPU média ultrapassar 50%
        averageUtilization: 50
  
  # Métrica de Memória (opcional)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        # Escala quando memória média ultrapassar 80%
        averageUtilization: 80
  
  # Comportamento do scaling
  behavior:
    scaleDown:
      # Política de scale down (redução de pods)
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      # Política de scale up (aumento de pods)
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
