# Service para expor o ServeRest
# Tipo NodePort para acesso externo no ambiente kind
apiVersion: v1
kind: Service
metadata:
  name: serverest
  namespace: serverest
  labels:
    app: serverest
spec:
  type: NodePort
  selector:
    app: serverest
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
    # NodePort fixo para facilitar acesso
    nodePort: 30000
  sessionAffinity: None
