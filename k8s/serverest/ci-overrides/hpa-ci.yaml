# HPA otimizado para CI (GitHub Actions runner)
# - maxReplicas: 4 (vs 10 em produção) para caber no runner
# - Mesmas métricas e thresholds do HPA original
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serverest-hpa
  namespace: serverest
  labels:
    app: serverest
    environment: ci
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: serverest
  
  minReplicas: 2
  maxReplicas: 4
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
