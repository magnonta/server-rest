name: Pipeline - Kubernetes (kind)

on:
  workflow_dispatch:
    inputs:
      test_health:
        description: 'Executar Health Check'
        type: boolean
        default: true
      test_smoke:
        description: 'Executar Smoke Test'
        type: boolean
        default: true
      test_load:
        description: 'Executar Load Test'
        type: boolean
        default: true
      test_stress:
        description: 'Executar Stress Test'
        type: boolean
        default: false
      test_spike:
        description: 'Executar Spike Test'
        type: boolean
        default: false
      test_soak:
        description: 'Executar Soak Test (40 min)'
        type: boolean
        default: false

env:
  BASE_URL: http://localhost:3000

jobs:
  load-testing-kubernetes:
    name: Load Testing (Kubernetes)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ---- Cluster Setup ----

      - name: Criar cluster kind (single-node CI)
        uses: helm/kind-action@v1
        with:
          cluster_name: serverest-ci
          config: k8s/kind/kind-config-ci.yaml
          wait: 60s

      - name: Verificar cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Instalar metrics-server
        run: |
          kubectl apply -f k8s/kind/metrics-server.yaml
          echo "Aguardando metrics-server ficar ready..."
          kubectl wait --for=condition=ready pod -l k8s-app=metrics-server \
            -n kube-system --timeout=90s

      # ---- Deploy ServeRest ----

      - name: Deploy ServeRest (manifests base)
        run: |
          kubectl apply -f k8s/serverest/00-namespace.yaml
          kubectl apply -f k8s/serverest/01-configmap.yaml
          kubectl apply -f k8s/serverest/02-deployment.yaml
          kubectl apply -f k8s/serverest/03-service.yaml
          kubectl apply -f k8s/serverest/04-hpa.yaml

      - name: Aplicar HPA otimizado para CI
        run: kubectl apply -f k8s/serverest/ci-overrides/hpa-ci.yaml

      - name: Aguardar pods ficarem ready
        run: |
          echo "Aguardando pods do ServeRest..."
          kubectl wait --for=condition=ready pod -l app=serverest \
            -n serverest --timeout=120s
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n serverest -o wide
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n serverest

      - name: Port forward ServeRest
        run: |
          kubectl port-forward -n serverest svc/serverest 3000:3000 &
          echo "Aguardando port-forward..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "ServeRest acessivel via port-forward!"
              break
            fi
            echo "Tentativa $i/20..."
            sleep 3
          done
          curl -f http://localhost:3000 || { echo "ERRO: port-forward falhou"; exit 1; }

      # ---- Testes de Carga ----

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Health Check
        if: inputs.test_health
        run: k6 run k6/scripts/00-health-check.js

      - name: Smoke Test
        if: inputs.test_smoke
        run: k6 run k6/scripts/01-smoke-test.js

      - name: Load Test
        if: inputs.test_load
        run: k6 run k6/scripts/02-load-test.js
        continue-on-error: true

      - name: Stress Test
        if: inputs.test_stress
        run: k6 run k6/scripts/03-stress-test.js
        continue-on-error: true

      - name: Spike Test
        if: inputs.test_spike
        run: k6 run k6/scripts/04-spike-test.js
        continue-on-error: true

      - name: Soak Test
        if: inputs.test_soak
        run: k6 run k6/scripts/05-soak-test.js
        continue-on-error: true

      # ---- Verificacao K8s ----

      - name: Verificar estado do cluster pós-testes
        if: always()
        run: |
          echo "=== HPA Status ==="
          kubectl get hpa -n serverest
          echo ""
          echo "=== Pods Status ==="
          kubectl get pods -n serverest -o wide
          echo ""
          echo "=== Pod Metrics ==="
          kubectl top pods -n serverest || echo "Metrics nao disponiveis ainda"
          echo ""
          echo "=== Node Metrics ==="
          kubectl top nodes || echo "Metrics nao disponiveis ainda"
          echo ""
          echo "=== Eventos Recentes ==="
          kubectl get events -n serverest --sort-by='.lastTimestamp' | tail -20

      # ---- Relatorios ----

      - name: Upload relatórios k6
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-kubernetes-reports
          path: |
            k6/results/*.json
            k6/results/*.html
          retention-days: 30

      - name: Resumo dos resultados
        if: always()
        run: |
          echo "## Resultados - Load Testing (Kubernetes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Modo:** kind cluster (single-node CI)" >> $GITHUB_STEP_SUMMARY
          echo "**BASE_URL:** $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "**HPA:** minReplicas=2, maxReplicas=4 (CI-optimized)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Testes executados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Teste | Selecionado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ inputs.test_health }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ inputs.test_smoke }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Test | ${{ inputs.test_load }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stress Test | ${{ inputs.test_stress }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Spike Test | ${{ inputs.test_spike }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Soak Test | ${{ inputs.test_soak }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Estado do Cluster" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get hpa -n serverest 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n serverest -o wide 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Relatórios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baixe os relatórios JSON e HTML na aba **Artifacts**." >> $GITHUB_STEP_SUMMARY
